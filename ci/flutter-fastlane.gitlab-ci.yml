# Shared GitLab CI jobs for Flutter apps built with the shared Fastfile.
#
# In the app's .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/sailingbyte/flutter-fastlane/master/ci/flutter-fastlane.gitlab-ci.yml
#
#   stages: [test, deploy]
#   variables:
#     FASTLANE_SHARED_REF: master   # same ref as in the include URL
#     FLUTTER_VERSION: "3.47.0"
#
# Flow
#   MR, test/*, main, main/*  -> fastlane test
#   test/*                    -> beta    (Play internal testing + TestFlight)
#   main, main/*              -> release (Play production + App Store)
#
# Changelog: hand-written fastlane/changelogs/<version>.txt (required for release jobs).
# Version from the branch name (optional): test/2.1.0, main/2.1.0, test/2.1.0+215
# Per-build changelog copies, screenshots and reports are committed back to the branch with
# `[skip ci]` (needs the CI_PUSH_TOKEN variable, see README).
#
# Toggle per app with ANDROID_ENABLED / IOS_ENABLED = "false".
# Secrets: see README.md ("Secrets"). Mark them Protected + Masked (or File).

variables:
  # Exact Flutter release to build with (e.g. "3.47.0"). Empty = whatever the Docker image ships.
  FLUTTER_VERSION: ""
  # Tag of ghcr.io/cirruslabs/flutter, which is only the base image (Android SDK, JDK, Flutter).
  # It lags behind new Flutter releases, so FLUTTER_VERSION is switched to officially from
  # github.com/flutter/flutter inside the job.
  FLUTTER_IMAGE_TAG: "stable"
  FASTLANE_VERSION: "2.228.0" # installed on every run, so apps need no Gemfile
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  GIT_DEPTH: "0"
  FASTLANE_COMMIT_CHANGES: "true" # commit fastlane/{metadata,screenshots,reports} back to the branch

.test_branch: &test_branch
  if: '$CI_COMMIT_BRANCH =~ /^test\//'

.main_branch: &main_branch
  if: '$CI_COMMIT_BRANCH =~ /^main(\/.*)?$/'

# --- Linux runner: tests + Android ------------------------------------------
.fastlane_linux:
  image: ghcr.io/cirruslabs/flutter:${FLUTTER_IMAGE_TAG}
  variables:
    GEM_HOME: "$CI_PROJECT_DIR/.gem"
  cache:
    key: "fastlane-linux-$CI_PROJECT_ID-$FASTLANE_VERSION"
    paths:
      - .gem
      - .pub-cache
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - export PATH="$GEM_HOME/bin:$PATH"
    - |
      if [ -n "$FLUTTER_VERSION" ] && ! flutter --version 2>/dev/null | grep -q "^Flutter $FLUTTER_VERSION "; then
        FLUTTER_DIR="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
        git config --global --add safe.directory "$FLUTTER_DIR"
        git -C "$FLUTTER_DIR" fetch --depth 1 https://github.com/flutter/flutter.git "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
        git -C "$FLUTTER_DIR" checkout -f "$FLUTTER_VERSION"
      fi
    - flutter --version
    # The Flutter image has no Ruby. Bake your own image to skip this step.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ruby-full build-essential
    - gem install fastlane -v "$FASTLANE_VERSION" --no-document

# --- macOS runner (shell executor, tag `macos`): iOS ---------------------------
# Needs Xcode, Flutter, Ruby + Bundler preinstalled on the runner.
.fastlane_macos:
  tags: [macos]
  variables:
    GEM_HOME: "$CI_PROJECT_DIR/.gem"
  before_script:
    - export PATH="$GEM_HOME/bin:$PATH"
    - gem install fastlane -v "$FASTLANE_VERSION" --no-document

fastlane:test:
  extends: .fastlane_linux
  stage: test
  script:
    - fastlane test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - <<: *test_branch
    - <<: *main_branch

fastlane:android:beta:
  extends: .fastlane_linux
  stage: deploy
  script:
    - fastlane android beta
  rules:
    - if: '$ANDROID_ENABLED == "false"'
      when: never
    - <<: *test_branch

fastlane:android:release:
  extends: .fastlane_linux
  stage: deploy
  script:
    - fastlane android release
  rules:
    - if: '$ANDROID_ENABLED == "false"'
      when: never
    - <<: *main_branch

fastlane:ios:beta:
  extends: .fastlane_macos
  stage: deploy
  script:
    - fastlane ios beta
  rules:
    - if: '$IOS_ENABLED == "false"'
      when: never
    - <<: *test_branch

fastlane:ios:release:
  extends: .fastlane_macos
  stage: deploy
  script:
    - fastlane ios release
  rules:
    - if: '$IOS_ENABLED == "false"'
      when: never
    - <<: *main_branch
